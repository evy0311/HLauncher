# Private to HLauncher; HDMI's ALSA plugin performs IEC958 framing.
# HLauncher mixes/resamples streams before this single playback endpoint.
</usr/share/alsa/alsa.conf>
pcm.hlauncher_hdmi {
    type plug
    slave {
        pcm "hdmi:CARD=vc4hdmi0,DEV=0"
        format S32_LE
        rate 48000
    }
}

# The voice stream is separate from HDMI media. The plug adapts our float stereo
# mixer output to the HFP codec's negotiated mono format/rate.
pcm.hlauncher_voice {
    type plug
    slave {
        pcm {
            type bluealsa
            device { @func getenv vars [ HLAUNCHER_RADIO_ADDRESS ] default "00:00:00:00:00:00" }
            profile "sco"
        }
        format S16_LE
        channels 1
    }
}
