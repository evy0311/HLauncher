# Private HLauncher DSP graph. No hardware enumeration or Bluetooth ownership.
context.properties = {
    core.daemon = true
    core.name = pipewire-0
    default.clock.rate = 48000
    default.clock.quantum = 960
    default.clock.min-quantum = 960
    default.clock.max-quantum = 960
    clock.power-of-two-quantum = false
}
context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    api.alsa.* = alsa/libspa-alsa
    support.* = support/libspa-support
}
context.modules = [
    { name = libpipewire-module-rt args = { nice.level = -11 rt.prio = 70 } flags = [ ifexists nofail ] }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-metadata }
    { name = libpipewire-module-profiler }
    { name = libpipewire-module-spa-node-factory }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-link-factory }
    # The private runtime directory confines clients. Normal same-user access
    # works on Bookworm too; access.force requires an external grant there.
    { name = libpipewire-module-access }
    { name = libpipewire-module-filter-chain args = {
        node.description = "HLauncher EQ"
        audio.channels = 2
        audio.position = [ FL FR ]
        filter.graph = {
            nodes = [
                { type = builtin name = bass label = bq_lowshelf control = { Freq = 100 Q = 0.707 Gain = 0 } }
                { type = builtin name = mid label = bq_peaking control = { Freq = 1000 Q = 0.707 Gain = 0 } }
                { type = builtin name = treble label = bq_highshelf control = { Freq = 8000 Q = 0.707 Gain = 0 } }
                { type = builtin name = b20 label = bq_peaking control = { Freq = 20 Q = 1.4 Gain = 0 } }
                { type = builtin name = b25 label = bq_peaking control = { Freq = 25 Q = 1.4 Gain = 0 } }
                { type = builtin name = b31 label = bq_peaking control = { Freq = 31.5 Q = 1.4 Gain = 0 } }
                { type = builtin name = b50 label = bq_peaking control = { Freq = 50 Q = 1.4 Gain = 0 } }
                { type = builtin name = b80 label = bq_peaking control = { Freq = 80 Q = 1.4 Gain = 0 } }
                { type = builtin name = b125 label = bq_peaking control = { Freq = 125 Q = 1.4 Gain = 0 } }
                { type = builtin name = b200 label = bq_peaking control = { Freq = 200 Q = 1.4 Gain = 0 } }
                { type = builtin name = b315 label = bq_peaking control = { Freq = 315 Q = 1.4 Gain = 0 } }
                { type = builtin name = b500 label = bq_peaking control = { Freq = 500 Q = 1.4 Gain = 0 } }
                { type = builtin name = b1k label = bq_peaking control = { Freq = 1000 Q = 1.4 Gain = 0 } }
                { type = builtin name = b2k label = bq_peaking control = { Freq = 2000 Q = 1.4 Gain = 0 } }
                { type = builtin name = b4k label = bq_peaking control = { Freq = 4000 Q = 1.4 Gain = 0 } }
                { type = builtin name = b8k label = bq_peaking control = { Freq = 8000 Q = 1.4 Gain = 0 } }
                { type = builtin name = b16k label = bq_peaking control = { Freq = 16000 Q = 1.4 Gain = 0 } }
            ]
            links = [
                { output = "bass:Out" input = "mid:In" }
                { output = "mid:Out" input = "treble:In" }
                { output = "treble:Out" input = "b20:In" }
                { output = "b20:Out" input = "b25:In" }
                { output = "b25:Out" input = "b31:In" }
                { output = "b31:Out" input = "b50:In" }
                { output = "b50:Out" input = "b80:In" }
                { output = "b80:Out" input = "b125:In" }
                { output = "b125:Out" input = "b200:In" }
                { output = "b200:Out" input = "b315:In" }
                { output = "b315:Out" input = "b500:In" }
                { output = "b500:Out" input = "b1k:In" }
                { output = "b1k:Out" input = "b2k:In" }
                { output = "b2k:Out" input = "b4k:In" }
                { output = "b4k:Out" input = "b8k:In" }
                { output = "b8k:Out" input = "b16k:In" }
            ]
            inputs = [ "bass:In" ]
            outputs = [ "b16k:Out" ]
        }
        capture.props = { node.name = hlauncher_eq media.class = Audio/Sink node.always-process = true }
        playback.props = { node.name = hlauncher_eq_output media.class = Audio/Source node.passive = true }
    } }
]
context.objects = [
    { factory = spa-node-factory args = {
        factory.name = support.node.driver
        node.name = Dummy-Driver
        node.group = pipewire.dummy
        priority.driver = 100
    } }
]
