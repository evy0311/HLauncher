[platformio]
default_envs = nanoatmega328new

[env]
platform = atmelavr@5.1.0
framework = arduino
monitor_speed = 115200

[env:nanoatmega328]
board = nanoatmega328
; The old ATmegaBOOT can get stuck after a watchdog reset. Bench use only.
build_flags = -D ENABLE_WATCHDOG=0

[env:nanoatmega328new]
board = nanoatmega328new
build_flags = -D ENABLE_WATCHDOG=1
